name: Tests

on:
  pull_request:
  push:
    branches:
      - master
      - develop
      - release-*

# We want to group to the workflow for each branch.
# Non-push events will be cancelled if a new one is started.
# Push events will run sequentially. This helps ensure that
# the `next` tag isn't out of sync.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - &enable-corepack
        name: Enable Corepack
        run: corepack enable && corepack prepare pnpm@9.15.4 --activate
      - &setup-node
        name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - &install-deps-directly
        name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Oxlint
        run: pnpm run lint
        working-directory: packages/axe-core

  fmt_check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - *enable-corepack
      - *setup-node
      - *install-deps-directly
      - run: pnpm run fmt:check
        working-directory: packages/axe-core

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - *enable-corepack
      - *setup-node
      - *install-deps-directly
      - &build
        name: Build
        # Run from repo root so Turborepo builds workspace dependencies in
        # the right order — `@axe-core/schemas` must be built before
        # `axe-core` so its `dist/index.d.ts` is on disk for tsc to resolve.
        run: pnpm run build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: axe-core
          path: packages/axe-core/dist/axe.js
          retention-days: 1

  # Vitest unit project — Node.js, no browser. Source-of-truth coverage
  # gate (currently 4% threshold; lifts when browser/integration coverage
  # reconciles, see Phase 5 #17).
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - *enable-corepack
      - *setup-node
      - *install-deps-directly
      - *build
      - name: Run Vitest Unit Project
        run: pnpm run test:vitest:unit
        working-directory: packages/axe-core

  # Vitest browser project — single-instance Chromium via Playwright.
  # Wrapped by `node ./test/setup/run-vitest-browser.mjs` to retry on the
  # known birpc-disconnect cascade in @vitest/browser-playwright@4.1.5
  # (vendor flake; see phase-04-a3-carryover-bugs.md).
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - *checkout
      - *enable-corepack
      - *setup-node
      - *install-deps-directly
      - *build
      - &cache-playwright
        name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - &install-playwright
        name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium firefox
        working-directory: packages/axe-core
      - &install-playwright-deps
        name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium firefox
        working-directory: packages/axe-core
      - name: Run Vitest Browser Project
        run: pnpm run test:vitest:browser
        working-directory: packages/axe-core

  # Vitest integration project — Chromium + Firefox via Playwright.
  # Drives ACT-rules, APG, and integration/full/* fixtures through the
  # in-tree fixture server (test/integration/_helpers/fixture-server.ts).
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - *checkout
      - *enable-corepack
      - *setup-node
      - *install-deps-directly
      - *build
      - *cache-playwright
      - *install-playwright
      - *install-playwright-deps
      - name: Run Vitest Integration Project
        run: pnpm run test:vitest:integration
        working-directory: packages/axe-core

  # Static type-check — separate job because tsc parallelizes poorly with
  # the test runs and a fast type signal is valuable on every PR.
  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - *enable-corepack
      - *setup-node
      - *install-deps-directly
      - *build
      - name: Run Type Check
        run: pnpm run test:tsc
        working-directory: packages/axe-core

  # Run examples under `doc/examples`
  test_examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - &install-deps
        name: Install Deps
        id: install-deps
        uses: ./.github/actions/install-deps
      - *build
      - name: Run Tests Against Examples
        run: pnpm run test:examples
        working-directory: packages/axe-core

  build_api_docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - *install-deps
      - name: Run API Docs Build
        run: pnpm run api-docs
        working-directory: packages/axe-core

  sri-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    # Run on master and RC branches along with PRs targeting those branches.
    if: ${{ github.ref_name == 'master' || startsWith(github.ref_name, 'release-') || github.event.pull_request.base.ref == 'master' || startsWith(github.event.pull_request.base.ref, 'release-') }}
    steps:
      - *checkout
      - *install-deps
      - name: Restore axe build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: axe-core
          path: packages/axe-core/dist
      - name: Validate Subresource Integrity
        run: pnpm run sri-validate
        working-directory: packages/axe-core
