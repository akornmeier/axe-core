name: Tests

on:
  pull_request:
  push:
    branches:
      - master
      - develop
      - release-*

# We want to group to the workflow for each branch.
# Non-push events will be cancelled if a new one is started.
# Push events will run sequentially. This helps ensure that
# the `next` tag isn't out of sync.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  CHROME_DEVEL_SANDBOX: /opt/google/chrome/chrome-sandbox

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - &enable-corepack
        name: Enable Corepack
        run: corepack enable && corepack prepare pnpm@9.15.4 --activate
      - &setup-node
        name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - &install-deps-directly
        name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Oxlint
        run: pnpm run lint
        working-directory: packages/axe-core

  fmt_check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - *enable-corepack
      - *setup-node
      - *install-deps-directly
      - run: pnpm run fmt:check
        working-directory: packages/axe-core

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - *enable-corepack
      - *setup-node
      - *install-deps-directly
      - &build
        name: Build
        # Run from repo root so Turborepo builds workspace dependencies in
        # the right order — `@axe-core/schemas` must be built before
        # `axe-core` so its `dist/index.d.ts` is on disk for tsc to resolve.
        # Building from packages/axe-core/ alone (the prior behavior) only
        # ran Vite for axe-core and skipped schemas, which is why
        # test_chrome / test_firefox failed at `tsc` with "Cannot find
        # module '@axe-core/schemas'".
        run: pnpm run build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: axe-core
          path: packages/axe-core/dist/
          retention-days: 1

  test_chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DISPLAY: :99
    steps:
      - *checkout
      - &install-deps-with-xvfb
        name: Install Deps
        uses: ./.github/actions/install-deps
        id: install-deps
        with:
          start-xvfb: ${{ env.DISPLAY }}
      - *build
      - name: Run Tests Against Chrome
        env:
          CHROME_BIN: ${{ steps.install-deps.outputs.chrome-path }}
          CHROMEDRIVER_BIN: ${{ steps.install-deps.outputs.chromedriver-path }}
        run: pnpm run test -- --browsers Chrome
        working-directory: packages/axe-core
      - name: Run Chrome Integration Tests
        env:
          CHROME_BIN: ${{ steps.install-deps.outputs.chrome-path }}
          CHROMEDRIVER_BIN: ${{ steps.install-deps.outputs.chromedriver-path }}
        run: pnpm run test:integration:chrome
        working-directory: packages/axe-core

  test_firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DISPLAY: :99
    steps:
      - *checkout
      - *install-deps-with-xvfb
      - *build
      - name: Run Tests Against Firefox
        env:
          FIREFOX_BIN: ${{ steps.install-deps.outputs.firefox-path }}
        run: pnpm run test -- --browsers Firefox
        working-directory: packages/axe-core
      - name: Run Firefox Integration Tests
        env:
          FIREFOX_BIN: ${{ steps.install-deps.outputs.firefox-path }}
        run: pnpm run test:integration:firefox
        working-directory: packages/axe-core

  # Vitest pilot: runs the Sprint 1 migrated subset (unit + browser + integration)
  # in parallel with the Karma jobs above. Strangler-fig migration — both stacks
  # must remain green for Sprints 2–3 of the Phase 3 plan.
  vitest_pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout
      - *enable-corepack
      - *setup-node
      - *install-deps-directly
      - *build
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium firefox
        working-directory: packages/axe-core
      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium firefox
        working-directory: packages/axe-core
      - name: Run Vitest Pilot Suite
        run: pnpm run test:vitest
        working-directory: packages/axe-core

  # Run examples under `doc/examples`
  test_examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - &install-deps
        name: Install Deps
        id: install-deps
        uses: ./.github/actions/install-deps
      - *build
      - name: Run Tests Against Examples
        run: pnpm run test:examples
        working-directory: packages/axe-core

  test_act:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    steps:
      - *checkout
      - *install-deps
      - &restore-axe-build
        name: Restore axe build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: axe-core
          path: packages/axe-core/dist
      - name: Run ACT Tests
        env:
          CHROME_BIN: ${{ steps.install-deps.outputs.chrome-path }}
          CHROMEDRIVER_BIN: ${{ steps.install-deps.outputs.chromedriver-path }}
        run: pnpm run test:act
        working-directory: packages/axe-core

  test_aria_practices:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    steps:
      - *checkout
      - *install-deps
      - *restore-axe-build
      - name: Run ARIA Practices Tests
        env:
          CHROME_BIN: ${{ steps.install-deps.outputs.chrome-path }}
          CHROMEDRIVER_BIN: ${{ steps.install-deps.outputs.chromedriver-path }}
        run: pnpm run test:apg
        working-directory: packages/axe-core

  test_locales:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    steps:
      - *checkout
      - *install-deps
      - *restore-axe-build
      - name: Run Locale Tests
        run: |
          pnpm run test:locales
          pnpm run test:locale-bundles
        working-directory: packages/axe-core

  test_virtual_rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    steps:
      - *checkout
      - *install-deps
      - *restore-axe-build
      - name: Run Virtual Rules Tests
        run: pnpm run test:virtual-rules
        working-directory: packages/axe-core

  test_jsdom:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    steps:
      - *checkout
      - *install-deps
      - *restore-axe-build
      - name: Run jsdom Tests
        run: pnpm run test:jsdom
        working-directory: packages/axe-core
      - name: Test bundle formats
        run: pnpm run test:bundle
        working-directory: packages/axe-core

  build_api_docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - *install-deps
      - name: Run API Docs Build
        run: pnpm run api-docs
        working-directory: packages/axe-core

  test_rule_help_version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ github.ref_name == 'master' }}
    steps:
      - *checkout
      - *install-deps
      - name: Run Rule Help Version Tests
        run: pnpm run test:rule-help-version
        working-directory: packages/axe-core

  sri-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    # Run on master and RC branches along with PRs targeting those branches.
    if: ${{ github.ref_name == 'master' || startsWith(github.ref_name, 'release-') || github.event.pull_request.base.ref == 'master' || startsWith(github.event.pull_request.base.ref, 'release-') }}
    steps:
      - *checkout
      - *install-deps
      - *restore-axe-build
      - name: Validate Subresource Integrity
        run: pnpm run sri-validate
        working-directory: packages/axe-core

  test_node:
    # Smoke-tests `axe.run()` against JSDOM on each supported Node major.
    # Matrix is bounded to versions covered by package.json `engines: ">=20.0.0"`
    # — Node 6 and 18 are EOL (2019, 2025) and were removed when CI was
    # aligned with the engines field. Sprint 5 task #12 (per
    # specs/phase-03-test-infrastructure-modernization-plan.md) will fold
    # this matrix into the Vitest `unit` project entirely.
    needs: build
    strategy:
      matrix:
        node:
          - 20
          - 22
          - 24
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - name: Enable Corepack
        run: corepack enable && corepack prepare pnpm@9.15.4 --activate
      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - *restore-axe-build
      - name: Run Node.js Tests
        run: pnpm run test:node
        working-directory: packages/axe-core
