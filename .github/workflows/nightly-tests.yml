name: Nightly Tests

on:
  schedule:
    # Runs every day at 2:17 AM UTC
    # Schedules should try to be offset from common times
    # to avoid high contention times on GitHub runners.
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Run the browser + integration projects nightly. Same scripts as the
  # PR-time `test.yml` jobs, but with `--frozen-lockfile=false` so that
  # latest upstream fixtures (wcag-act-rules#main, aria-practices#main)
  # can be installed first.
  #
  # Phase 4 carryover: the legacy nightly differentiated against system
  # Chrome Beta and Firefox Nightly via Karma's --browsers flag. Vitest
  # browser mode uses Playwright's bundled browsers. To restore channel
  # testing, configure `vitest.workspace.ts` browser instances with
  # Playwright's `channel: 'chrome-beta' | 'firefox-nightly'` and add
  # `--with-deps chrome-beta firefox-nightly` to the Playwright install
  # step here. Tracked in specs/phase-04-a3-carryover-bugs.md.
  vitest_latest_upstream:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Enable Corepack
        run: corepack enable && corepack prepare pnpm@9.15.4 --activate
      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Latest WCAG ACT Rules
        run: pnpm add w3c/wcag-act-rules#main
        working-directory: packages/axe-core
      - name: Install Latest W3C Aria Practices
        run: pnpm add w3c/aria-practices#main
        working-directory: packages/axe-core
      - name: Build
        run: pnpm run build
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium firefox
        working-directory: packages/axe-core
      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium firefox
        working-directory: packages/axe-core
      - name: Run Vitest Browser Project
        run: pnpm run test:vitest:browser
        working-directory: packages/axe-core
      - name: Run Vitest Integration Project (incl. ACT + APG against #main)
        run: pnpm run test:vitest:integration
        working-directory: packages/axe-core
